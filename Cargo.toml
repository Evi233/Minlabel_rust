[package]
name = "minlabel"
version = "0.1.0"
edition = "2021"
description = "A minimal image labeling tool"

[dependencies]
eframe = "0.36"
rfd = "0.17"
cpal = "0.18"
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }

[profile.release]
strip = true
